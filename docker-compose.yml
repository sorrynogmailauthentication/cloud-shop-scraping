services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    expose:
      - "4000"

  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
      args:
        VITE_API_URL: ""
    depends_on:
      - backend
    ports:
      - "80:80"
      # add "443:443" when TLS config is ready
    restart: unless-stopped