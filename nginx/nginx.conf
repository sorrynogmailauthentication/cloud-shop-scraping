events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # HTTP -> HTTPS redirect
  server {
    listen 80;
    server_name tsenalitika.ru www.tsenalitika.ru;
    return 301 https://tsenalitika.ru$request_uri;
  }

  # Secondary domain -> canonical domain redirect
  server {
    listen 80;
    server_name xn--80aannameo2c8a.xn--p1ai www.xn--80aannameo2c8a.xn--p1ai;
    return 301 https://tsenalitika.ru$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name tsenalitika.ru www.tsenalitika.ru;

    ssl_certificate     /etc/letsencrypt/live/tsenalitika.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tsenalitika.ru/privkey.pem;

    # Optional sane TLS defaults
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }

    location /api/ {
      proxy_pass http://backend:4000/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth {
      return 204;
      }

    location /auth/ {
      proxy_pass http://backend:4000/auth/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
      proxy_pass http://backend:4000/health;
      proxy_set_header Host $host;
    }
  }

  # HTTPS secondary domain -> canonical domain redirect
  # NOTE: requires certificate that includes xn--80aannameo2c8a.xn--p1ai (and optionally www.xn--80aannameo2c8a.xn--p1ai)
  server {
    listen 443 ssl http2;
    server_name xn--80aannameo2c8a.xn--p1ai www.xn--80aannameo2c8a.xn--p1ai;

    ssl_certificate     /etc/letsencrypt/live/xn--80aannameo2c8a.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--80aannameo2c8a.xn--p1ai/privkey.pem;

    # Optional sane TLS defaults
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://tsenalitika.ru$request_uri;
  }
}