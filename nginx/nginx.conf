events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # HTTP -> HTTPS redirect
  server {
    listen 80;
    server_name test-project-deploy.ru www.test-project-deploy.ru;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name test-project-deploy.ru www.test-project-deploy.ru;

    ssl_certificate     /etc/letsencrypt/live/test-project-deploy.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test-project-deploy.ru/privkey.pem;

    # Optional sane TLS defaults
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }

    location /api/ {
      proxy_pass http://backend:4000/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth {
      return 204;
      }

    location /auth/ {
      proxy_pass http://backend:4000/auth/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
      proxy_pass http://backend:4000/health;
      proxy_set_header Host $host;
    }
  }
}